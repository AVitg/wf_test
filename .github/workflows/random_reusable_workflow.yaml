name: "my random workflow"
on: 
    workflow_call:
     inputs:      
      app-env:
        required: true
        type: string
jobs:
    randomsomething:
        environment: ${{ inputs.app-env }}
        runs-on: ubuntu-slim
        steps:
          - name: Checkout Code
            uses: actions/checkout@v6
            with:
              fetch-depth: 0 

          - name: Set up Python environment
            run: |
              echo "Setting up Python environment" 
              pip install -r script/requirements.txt

          - name: run python
            run: |               
              echo "Running script: $script"
              ENV=${{ inputs.app-env }} python3 script/main.py