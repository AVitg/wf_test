name: "my random workflow"
on: 
    workflow_call:
     inputs:      
      dispatch-environment:
        required: true
        type: string
      # has-dev:
      #   type: boolean
      #   default: false
      # has-preprod:
      #   type: boolean
      #   default: false
      # has-prod:
      #   type: boolean
      #   default: false


jobs: 
  setup:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_envs: ${{ steps.build-matrix.outputs.has_envs }}
    steps:
      - name: Build deployment matrix
        id: build-matrix
        run: |
          ENVS='[]'
          APP_PATH="${{ inputs.dispatch-environment }}"

          add_env() {
            local ENV_NAME=$1                     
            echo "${ENV_NAME} added to ENVS"
            ENVS=$(echo "$ENVS" | jq -c \
              --arg env "$ENV_NAME" \
              '. + [{env: $env}]')
          }
          add_env "dev"
          echo ${ENVS}
          add_env "preprod"
          echo ${ENVS}
          add_env "prod"
          echo ${ENVS}          
          MATRIX=$(echo "$ENVS" | jq -c '{include: .}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          COUNT=$(echo "$ENVS" | jq '. | length')
          echo "Deploying to $COUNT environment(s): $(echo "$ENVS" | jq -r '[.[].env] | join(", ")')"
          



  randomsomething:
        
        needs: [setup]
        strategy:
              matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
              fail-fast: false
        runs-on: ubuntu-slim        
        environment: ${{ matrix.env }}
        steps:
          - name: Checkout Code
            uses: actions/checkout@v6
            with:
              fetch-depth: 0 

          - name: Set up Python environment
            run: |
              echo "Setting up Python environment" 
              pip install -r script/requirements.txt

          - name: run python
            run: |               
              echo "Running script: $script"
              ENV=${{ inputs.dispatch-environment }} python3 script/main.py
